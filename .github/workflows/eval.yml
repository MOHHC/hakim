name: Evaluation

on:
  workflow_dispatch:  # Manual trigger from Actions tab
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6 AM UTC

jobs:
  eval-pipeline:
    name: Evaluation (emergency recall >= 95%)
    runs-on: ubuntu-latest
    # Pacing the LLM calls under the providers' free-tier limits makes a full
    # 50-scenario run take ~15-20 min; the timeout is a backstop, not a target.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run evaluation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Groq's free tier allows ~1000 output tokens/min (~6 triage calls);
          # at the app's burst-friendly 30 RPM the run spilled onto Gemini,
          # whose free tier allows only ~20 requests a day.
          GROQ_RPM: "6"
        run: python -m tests.eval.run_eval --skip-quality --concurrency 1 --output eval_results.md
      # Always publish the report — an inconclusive run needs its error detail
      # just as much as a failing one.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-results
          path: |
            backend/eval_results.md
            backend/eval_results.json
          if-no-files-found: warn
      - name: Publish report to job summary
        if: always()
        run: cat eval_results.md >> "$GITHUB_STEP_SUMMARY" || true
